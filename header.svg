<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;900&family=Space+Grotesk:wght@400;700&display=swap');
      .title {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 900;
        fill: url(#text-grad);
        font-size: 48px;
        letter-spacing: 2px;
      }
      .subtitle {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        fill: #ff9500;
        font-size: 14px;
        letter-spacing: 5px;
        text-transform: uppercase;
      }
      .slogan {
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 400;
        fill: #cbd5e1;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .tag {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 11px;
        fill: #ff2d55;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .border-glow {
        stroke: url(#border-grad);
        stroke-width: 1.5;
        fill: none;
      }
    </style>
    
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c0c" />
      <stop offset="100%" stop-color="#221919" />
    </linearGradient>
    
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2d55" />
      <stop offset="100%" stop-color="#ff3b30" />
    </linearGradient>

    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d55" opacity="0.8"/>
      <stop offset="50%" stop-color="#ff9500" opacity="0.3"/>
      <stop offset="100%" stop-color="#ff3b30" opacity="0.8"/>
    </linearGradient>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.03">
    <line x1="50" y1="0" x2="50" y2="300" />
    <line x1="100" y1="0" x2="100" y2="300" />
    <line x1="150" y1="0" x2="150" y2="300" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="250" y1="0" x2="250" y2="300" />
    <line x1="300" y1="0" x2="300" y2="300" />
    <line x1="350" y1="0" x2="350" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="450" y1="0" x2="450" y2="300" />
    <line x1="500" y1="0" x2="500" y2="300" />
    <line x1="550" y1="0" x2="550" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="650" y1="0" x2="650" y2="300" />
    <line x1="700" y1="0" x2="700" y2="300" />
    <line x1="750" y1="0" x2="750" y2="300" />
    
    <line x1="0" y1="50" x2="800" y2="50" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="250" x2="800" y2="250" />
  </g>

  
        <!-- Crypto Hexagons -->
        <g stroke="#ff3b30" stroke-width="0.5" fill="none" opacity="0.15">
          <polygon points="120,50 150,67 150,103 120,120 90,103 90,67" />
          <polygon points="120,50 120,120" />
          <polygon points="90,67 150,103" />
          <polygon points="150,67 90,103" />
          <circle cx="120" cy="85" r="4" fill="#ff2d55" opacity="0.7"/>
          
          <polygon points="700,180 730,197 730,233 700,250 670,233 670,197" />
          <polygon points="700,180 700,250" />
          <circle cx="700" cy="215" r="4" fill="#ff9500" opacity="0.7"/>
        </g>
        
        <!-- Testing Grid & Checkmarks -->
        <g stroke="#ff3b30" stroke-width="0.5" opacity="0.15">
          <line x1="0" y1="50" x2="800" y2="50" stroke-dasharray="5,5" />
          <line x1="0" y1="250" x2="800" y2="250" stroke-dasharray="5,5" />
          <rect x="730" y="40" width="20" height="20" rx="3" fill="none" stroke="#ff2d55" stroke-width="1"/>
          <path d="M 734 50 L 738 54 L 746 44" fill="none" stroke="#ff9500" stroke-width="2" />
        </g>
        

  <!-- Glow Effect behind Username -->
  <text x="400" y="135" text-anchor="middle" class="title" opacity="0.3" filter="url(#glow)">8figuresfigure8</text>

  <!-- Content -->
  <g transform="translate(0, 0)">
    <!-- Tech Tags at top -->
    <g transform="translate(400, 55)" text-anchor="middle">
      <rect x="-180" y="-12" width="110" height="20" rx="10" fill="#221919" stroke="#ff2d55" stroke-width="0.5" opacity="0.6"/>
      <text x="-125" y="2" text-anchor="middle" class="tag">TESTING</text>
      
      <rect x="70" y="-12" width="110" height="20" rx="10" fill="#221919" stroke="#ff3b30" stroke-width="0.5" opacity="0.6"/>
      <text x="125" y="2" text-anchor="middle" class="tag">WEB3</text>
    </g>

    <!-- Main Title (Username) -->
    <text x="400" y="135" text-anchor="middle" class="title">8figuresfigure8</text>
    
    <!-- Subtitle (Tracks) -->
    <text x="400" y="180" text-anchor="middle" class="subtitle">TESTING // WEB3 AND CRYPTO</text>
    
    <!-- Slogan / Bio -->
    <text x="400" y="225" text-anchor="middle" class="slogan">Chaos engineering advocate. Bug hunter. Quality maximalist.</text>
  </g>

  <!-- Glowing Border -->
  <rect x="4" y="4" width="792" height="292" rx="12" class="border-glow" />
</svg>
